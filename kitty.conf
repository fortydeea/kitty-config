include ./theme.conf

# Font configuration
font_family          Hack Nerd Font Mono
bold_font            auto
italic_font          auto
bold_italic_font     auto
font_size            14

# Cursor animation configuration
cursor_shape block
cursor_trail 1
cursor_decay 0.01 0.1
cursor_trail_start_threshold 100

# Background opacity configuration
background_opacity 0.8

# Display configuration for WSL
linux_display_server x11
